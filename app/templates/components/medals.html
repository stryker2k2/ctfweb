<!-- medals.html -->

<div class="card" data-bs-theme="dark">
    <div class="card-header">
        {{class['title']}}
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-4 d-flex align-items-center">
                <span>
                    <img class="w-50" src="{{url_for('static', filename='img/' + class['img'])}}">
                </span>
            </div>
            <div class="col-8">
                <h5 class="card-title">{{class['description']}}</h5>
                <p class="card-text">{{class['subtext']}}</p>
                {% if class['active'] == true %}
                    <a href="{{url_for('main.challenge', medal=class['title']) | lower}}" class="btn btn-primary">{{class['submit_btn']}}</a>
                {% else %}
                    <a href="#" class="btn btn-warning">{{class['submit_btn']}}</a>
                {% endif %}
                
            </div>
        </div>
    </div>
</div>
